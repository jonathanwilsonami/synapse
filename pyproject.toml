[project]
name = "synapse"
version = "0.1.0"
description = "MVP kernel for agentic AI in cyber-physical systems"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "mcp>=1.30.0",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "simpy>=4.1.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"
